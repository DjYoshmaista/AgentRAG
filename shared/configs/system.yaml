# System Configuration
system:
  name: "Multi-Agent Orchestration System"
  version: "1.0.0"
  environment: "development"

# Service Configuration
services:
  orchestrator:
    host: "localhost"
    port: 8001
    workers: 1
    
  model_gateway:
    host: "localhost"
    port: 8070
    ollama_url: "http://localhost:11434"
    default_model: "llama2"
    
  vector_engine:
    host: "localhost"
    port: 8080
    vector_dimension: 1024
    
  message_broker:
    host: "localhost"
    port: 4222
    jetstream_enabled: true

# Database Configuration  
databases:
  postgresql:
    host: "localhost"
    port: 5432
    database: "agentic_system"
    username: "postgres"
    password: "password"
    
  qdrant:
    host: "localhost"
    port: 6333
    collection_name: "embeddings"

# Task Configuration
tasks:
  max_queue_size: 1000
  default_timeout: 300  # seconds
  max_retries: 3
  
  priorities:
    low: 1
    normal: 2
    high: 3
    critical: 4

# Model Configuration
models:
  default_models:
    - "qwen3:8b"
    - "qwen3-coder"
    - "gemma3n:e4b"
    
  parameters:
    temperature: 0.5
    max_tokens: 20000
    top_p: 0.9

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/system.log"
  max_size: "10MB"
  backup_count: 5

# Monitoring Configuration
monitoring:
  metrics_enabled: true
  health_check_interval: 30  # seconds
  performance_tracking: true
